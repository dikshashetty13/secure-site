<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Signup and Login</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #303030;
            color: white;
            text-align: center;
            padding: 2rem;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background-color: #424242;
            padding: 1.5rem;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #689f38;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin: 0.5rem 0 0.2rem;
            text-align: left;
        }

        input {
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: none;
            border-radius: 5px;
        }

        button {
            padding: 0.5rem;
            background-color: #689f38;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            background-color: #558b2f;
        }

        p.message {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #ff5722;
        }
    </style>
</head>
<body>
    <h1>Secure App</h1>
    
    <div class="container">
        <h2>Signup</h2>
        <form onsubmit="secureSignup(); return false;">
            <label for="signupEmail">Email</label>
            <input type="email" id="signupEmail" placeholder="Enter your email" required>
            <label for="signupPassword">Password</label>
            <input type="password" id="signupPassword" placeholder="Enter your password" required>
            <button type="submit">Sign Up</button>
        </form>
        <p id="signupMessage" class="message"></p>
    </div>

    <div class="container" style="margin-top: 2rem;">
        <h2>Login</h2>
        <form onsubmit="secureLogin(); return false;">
            <label for="loginEmail">Email</label>
            <input type="text" id="loginEmail" placeholder="Enter your email" required>
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>
            <button type="submit">Login</button>
        </form>
        <p id="loginMessage" class="message"></p>
        
    </div>

    <script src="secure.js"></script> <!-- Linking the secure JS file -->
</body>
</html>
